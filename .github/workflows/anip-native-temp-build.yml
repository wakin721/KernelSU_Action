name: Temporary ANIP native build

on:
  push:
    branches:
      - tmp/anip-ksu-native-build-20260928
    paths:
      - "anip-native-build/**"
      - ".github/workflows/anip-native-temp-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat anip-native-build/chunks/src{00..07}.b64 > /tmp/anip-source.b64
          base64 -d /tmp/anip-source.b64 > /tmp/anip-source.zip
          echo "3f2667ca67b4c12b0384c7a61a5feee54f7e3a5021651fa171b56d03869a1558  /tmp/anip-source.zip" | sha256sum -c -
          rm -rf /tmp/anip-src
          mkdir -p /tmp/anip-src
          unzip -q /tmp/anip-source.zip -d /tmp/anip-src
          test -f /tmp/anip-src/ANIP-KSU-Native/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Install Python image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg

      - name: Run source self-test
        working-directory: /tmp/anip-src/ANIP-KSU-Native
        run: python tools/selftest.py

      - name: Bootstrap pinned dependencies
        working-directory: /tmp/anip-src/ANIP-KSU-Native
        run: bash tools/bootstrap_deps.sh

      - name: Generate embedded ANIP table
        working-directory: /tmp/anip-src/ANIP-KSU-Native
        run: python tools/sync_anip.py --repo .deps/anip

      - name: Compile embedded HookBridge
        working-directory: /tmp/anip-src/ANIP-KSU-Native
        run: python tools/build_bridge.py

      - name: Build native AAR
        working-directory: /tmp/anip-src/ANIP-KSU-Native
        run: gradle :native:assembleRelease --no-daemon --stacktrace

      - name: Package KernelSU module
        working-directory: /tmp/anip-src/ANIP-KSU-Native
        run: |
          python tools/package_module.py             --aar native/build/outputs/aar/native-release.aar             --out dist/ANIP-KSU-Native-v0.2.0-beta1.zip
          sha256sum dist/ANIP-KSU-Native-v0.2.0-beta1.zip > dist/ANIP-KSU-Native-v0.2.0-beta1.zip.sha256
          unzip -l dist/ANIP-KSU-Native-v0.2.0-beta1.zip

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: ANIP-KSU-Native-v0.2.0-beta1
          path: |
            /tmp/anip-src/ANIP-KSU-Native/dist/ANIP-KSU-Native-v0.2.0-beta1.zip
            /tmp/anip-src/ANIP-KSU-Native/dist/ANIP-KSU-Native-v0.2.0-beta1.zip.sha256
          if-no-files-found: error
